name: Auto Update WCG Stats & Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcm-stats-deploy-main
  cancel-in-progress: false

jobs:
  update-stats-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Fetch latest WCG stats
        if: github.event_name != 'push'
        run: |
          python scripts/fetch_real_data_bs4.py

      - name: Commit and push stats changes
        if: github.event_name != 'push'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add src/server_stats.json public/server_stats.json src/serverData.ts

          if git diff --cached --quiet; then
            echo 'No stats changes to commit.'
          else
            git commit -m '🤖 Auto-update WCG stats data'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
